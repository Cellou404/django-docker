name: Django CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U myuser -d mydb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          # python -m venv venv
          sudo apt-get update
          # echo "source venv/bin/activate" >> $GITHUB_ENV
          # source venv/bin/activate
          pip install -r requirements.txt

      - name: Appliquer les migrations
        run: |
          source venv/bin/activate
          python manage.py migrate

      - name: Lancer les tests avec pytest
        run: |
          export DJANGO_SETTINGS_MODULE=config.settings
          pytest --cov=config --cov-report=xml

      - name: Sauvegarder le rapport de couverture
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
